<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShowBies: Zombie Shooter</title>
  <meta name="description" content="ShowBies: Zombie Shooter, a top-down zombie shooter for Android by j'ntr.">
  <style>
    :root {
      --fondo: #06070b;
      --panel: #0b0d13;
      --texto: #f2f4f8;
      --suave: #8a94ad;
      --celeste: #00e5ff;
      --rosa: #ffb3f2;
      --verde: #39ff88;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 32px 28px;
      background: var(--panel);
      border: 2px solid var(--celeste);
      border-radius: 18px;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.25);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      letter-spacing: 0.02em;
      color: var(--rosa);
      text-shadow: 0 0 12px rgba(255, 43, 214, 0.6);
    }
    p { margin: 0 0 6px; color: var(--suave); }
    .boton {
      display: inline-block;
      margin: 22px 0 18px;
      padding: 12px 26px;
      border-radius: 999px;
      background: var(--verde);
      color: #03200f;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 0 16px rgba(57, 255, 136, 0.45);
    }
    .boton:focus-visible, a:focus-visible { outline: 2px solid var(--celeste); outline-offset: 3px; }
    footer { margin-top: 8px; font-size: 0.9rem; }
    footer a { color: var(--celeste); }
  </style>
</head>
<body>
  <main>
    <h1>ShowBies</h1>
    <p>A top-down zombie shooter for Android.</p>
    <p>Un shooter de zombis para Android.</p>
    <a class="boton" href="https://play.google.com/store/apps/details?id=com.ivanruiz.showbies">Google Play</a>
    <footer>
      <p>by j'ntr</p>
      <p><a href="https://ivanlruiz.github.io/showbies-privacidad/">Privacy policy / Política de privacidad</a></p>
    </footer>
  </main>
</body>
</html>
